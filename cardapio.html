<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F5A3F">
<title>Cardápio</title>
<style>
:root{
  --bg:#F5F7F4; --card:#FFFFFF; --ink:#17231D; --muted:#5E6B64; --line:#DDE4DF;
  --green:#1F5A3F; --on-green:#FFFFFF; --gold:#F4C542; --on-gold:#17231D; --err:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1713; --card:#17221C; --ink:#EAF1EC; --muted:#9AA9A0; --line:#27352D;
        --green:#3E9B6F; --on-green:#07130C; --err:#FF8A80; color-scheme:dark;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hero{position:relative;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:24px 20px 28px;color:#fff;overflow:hidden;background:#10241b center/cover}
#hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,12,.1) 0%,rgba(8,16,12,.55) 55%,rgba(8,16,12,.92) 100%)}
#hero>*{position:relative}
#hero .plate{position:absolute;right:-70px;top:-24px;width:250px;height:250px;border-radius:50%;background:center/cover;box-shadow:0 20px 44px rgba(0,0,0,.55)}
#hero h1{margin:10px 0 0;font:700 2.5rem/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#hero p{margin:8px 0 0;max-width:34ch;opacity:.95}
.tag{background:var(--gold);color:var(--on-gold);font-size:.82rem;font-weight:700;border-radius:999px;padding:4px 12px}
.cta{margin-top:16px;border:0;border-radius:12px;padding:13px 22px;background:var(--gold);color:var(--on-gold);font-weight:700;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer}
nav button[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:60px}
h2{font:700 1.35rem/1.2 Georgia,"Times New Roman",serif;margin:28px 0 10px}
.item{display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.thumb{width:104px;height:104px;border-radius:10px;background:#1b2a22 center/cover}
.body{min-width:0;display:flex;flex-direction:column}
.item h3{margin:0;font-size:1.02rem}
.item p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:700;white-space:nowrap}
.act{display:flex;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--green);color:var(--on-green)}
.step{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:42px;height:38px;border:0;background:transparent;font-size:1.3rem;cursor:pointer}
.step output{min-width:28px;text-align:center;font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none;z-index:6}
#bar.on{display:block}
#bar button{width:100%;max-width:640px;margin:0 auto;display:flex;justify-content:space-between;background:var(--gold);color:var(--on-gold);border:0;border-radius:12px;padding:15px 18px;font-weight:700;cursor:pointer}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin-top:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:70px;resize:vertical}
.err{color:var(--err);font-size:.9rem;min-height:1.2em;margin:4px 0 0}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1;padding:14px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.wa{background:#25D366;color:#06210F}
.off{display:none;background:var(--gold);color:var(--on-gold);text-align:center;padding:6px;font-size:.85rem}
.off.on{display:block}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="off" id="off">Sem internet. Você ainda pode montar o pedido; o envio precisa de conexão.</div>
<header id="hero">
  <div class="plate" id="plate"></div>
  <span class="tag" id="selo"></span>
  <h1 id="nome"></h1>
  <p id="sub"></p>
  <button class="cta" id="ver">Ver cardápio</button>
</header>
<nav id="nav" aria-label="Categorias"></nav>
<main id="menu"></main>

<div id="bar"><button id="open"><span id="cnt"></span><span id="sum"></span></button></div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="ttl">
  <div class="panel">
    <h2 id="ttl">Seu pedido</h2>
    <div id="lines"></div>
    <div class="total"><span>Total</span><span id="tot"></span></div>
    <label for="cli">Seu nome</label>
    <input id="cli" autocomplete="name">
    <label for="tipo">Como vai receber?</label>
    <select id="tipo"></select>
    <div id="endw"><label for="end" id="endl">Endereço</label><input id="end" autocomplete="street-address"></div>
    <label for="pag">Pagamento</label>
    <select id="pag"></select>
    <label for="obs">Observações</label>
    <textarea id="obs" placeholder="Ex.: sem cebola"></textarea>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button class="btn ghost" id="close">Voltar</button>
      <button class="btn wa" id="send">Enviar pelo WhatsApp</button>
    </div>
  </div>
</div>

  taxaEntrega: 0
};
/* Foto do prato: acrescente img:"fotos/feijoada.jpg" ao item. Sem img, aparece um prato ilustrado. */
const MENU = [
  { c: "Pratos", n: "Feijoada completa", d: "Feijão preto, arroz, couve, farofa e laranja.", p: 42, img: FOTOS.feijoada },
  { c: "Pratos", n: "Frango grelhado", d: "Filé de frango, arroz, feijão e salada.", p: 32.5, img: FOTOS.frango },
  { c: "Pratos", n: "Parmegiana", d: "Bife empanado com queijo e molho, arroz e batata frita.", p: 38, img: FOTOS.parmegiana },
  { c: "Lanches", n: "X-Burger", d: "Pão, hambúrguer 150 g, queijo, alface e tomate.", p: 24, img: FOTOS.xburger },
  { c: "Lanches", n: "X-Bacon", d: "Hambúrguer 150 g, queijo, bacon crocante e maionese da casa.", p: 29, img: FOTOS.xbacon },
  { c: "Bebidas", n: "Suco natural", d: "Laranja, limão ou maracujá. 400 ml.", p: 9, img: FOTOS.suco },
  { c: "Bebidas", n: "Refrigerante lata", d: "350 ml.", p: 6, img: FOTOS.refri },
  { c: "Sobremesas", n: "Pudim", d: "Fatia generosa com calda de caramelo.", p: 12, img: FOTOS.pudim }
];
/* ========================= */

const $ = id => document.getElementById(id);
const money = v => v.toLocaleString(CONFIG.locale, { style: "currency", currency: CONFIG.moeda });
const KEY = "cardapio:" + CONFIG.whatsapp;
let cart = {};
try { cart = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { cart = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) {} };
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

document.title = CONFIG.nome + " – Cardápio";
$("nome").textContent = CONFIG.nome;
$("sub").textContent = CONFIG.sub;
$("selo").textContent = CONFIG.selo || "";
$("selo").style.display = CONFIG.selo ? "inline-block" : "none";
$("ver").onclick = () => $("menu").scrollIntoView();

/* Prato ilustrado de reserva (aparece quando o item não tem foto) */
const PAL = { Pratos: ["#8B4A2B", "#E9B44C", "#4C8C4A"], Lanches: ["#C7822E", "#5A3320", "#6FAE4B"], Bebidas: ["#F28C28", "#FFD36B", "#2E7D5B"], Sobremesas: ["#7A3E1D", "#F6D9A8", "#D94B6A"] };
function art(c, i) {
  const p = PAL[c] || ["#B5651D", "#F4C542", "#4C8C4A"];
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><radialGradient id='g' cx='50%' cy='40%'><stop offset='0' stop-color='#fff'/><stop offset='1' stop-color='#d9dedb'/></radialGradient></defs>" +
    "<rect width='200' height='200' fill='#1b2a22'/><circle cx='100' cy='106' r='82' fill='#0d1511' opacity='.5'/><circle cx='100' cy='100' r='80' fill='url(#g)'/>" +
    "<circle cx='100' cy='100' r='62' fill='none' stroke='#c9d0cc' stroke-width='3'/><g transform='rotate(" + ((i * 53) % 360) + " 100 100)'>" +
    "<ellipse cx='92' cy='96' rx='38' ry='28' fill='" + p[0] + "'/><ellipse cx='118' cy='108' rx='26' ry='20' fill='" + p[1] + "'/>" +
    "<circle cx='80' cy='116' r='12' fill='" + p[2] + "'/><circle cx='122' cy='80' r='9' fill='" + p[2] + "'/><ellipse cx='84' cy='88' rx='14' ry='7' fill='#fff' opacity='.18'/></g></svg>";
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
function useImg(target, src, fallbackArt) {
  target.style.backgroundImage = fallbackArt;
  if (!src) return false;
  const im = new Image();
  im.onload = () => { target.style.backgroundImage = "url(" + JSON.stringify(src) + ")"; };
  im.src = src;
  return true;
}
/* Capa: foto se houver, senão prato ilustrado grande */
$("plate").style.backgroundImage = art("Pratos", 1);
if (CONFIG.capa) {
  $("plate").style.display = "none";
  const im = new Image();
  im.onload = () => { $("hero").style.backgroundImage = "url(" + JSON.stringify(CONFIG.capa) + ")"; };
  im.onerror = () => { $("plate").style.display = "block"; };
  im.src = CONFIG.capa;
}

const cats = [...new Set(MENU.map(i => i.c))];
const actEls = {};

cats.forEach(c => {
  const b = el("button", "", c);
  b.onclick = () => $("sec-" + c).scrollIntoView();
  b.dataset.c = c;
  $("nav").appendChild(b);
  const s = el("section"); s.id = "sec-" + c;
  s.appendChild(el("h2", "", c));
  MENU.forEach((it, idx) => {
    if (it.c !== c) return;
    const box = el("div", "item");
    const th = el("div", "thumb"); th.setAttribute("role", "img"); th.setAttribute("aria-label", it.n);
    useImg(th, it.img, art(it.c, idx));
    const body = el("div", "body"), foot = el("div", "foot");
    const act = el("div", "act"); actEls[idx] = act;
    foot.append(el("div", "price", money(it.p)), act);
    body.append(el("h3", "", it.n), el("p", "", it.d), foot);
    box.append(th, body);
    s.appendChild(box);
  });
  $("menu").appendChild(s);
});

function qty(i, d) {
  const q = Math.max(0, (cart[i] || 0) + d);
  if (q) cart[i] = q; else delete cart[i];
  save(); paint();
}
function paint() {
  MENU.forEach((it, i) => {
    const act = actEls[i], q = cart[i] || 0;
    act.replaceChildren();
    if (!q) {
      const a = el("button", "btn", "Adicionar"); a.onclick = () => qty(i, 1);
      a.setAttribute("aria-label", "Adicionar " + it.n); act.appendChild(a);
    } else {
      const s = el("div", "step"), m = el("button", "", "−"), p = el("button", "", "+"), o = el("output", "", q);
      m.setAttribute("aria-label", "Remover um " + it.n); p.setAttribute("aria-label", "Adicionar mais um " + it.n);
      m.onclick = () => qty(i, -1); p.onclick = () => qty(i, 1);
      s.append(m, o, p); act.appendChild(s);
    }
  });
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $("bar").classList.toggle("on", n > 0);
  $("cnt").textContent = "Ver pedido (" + n + (n === 1 ? " item)" : " itens)");
  $("sum").textContent = money(subtotal());
  if ($("sheet").classList.contains("on")) lines();
}
const subtotal = () => Object.entries(cart).reduce((a, [i, q]) => a + (MENU[i] ? MENU[i].p * q : 0), 0);
const taxa = () => $("tipo").value === "Entrega" ? CONFIG.taxaEntrega : 0;

function lines() {
  const box = $("lines"); box.replaceChildren();
  Object.entries(cart).forEach(([i, q]) => {
    const it = MENU[i]; if (!it) return;
    const l = el("div", "line"); l.append(el("span", "", q + "× " + it.n), el("span", "", money(it.p * q))); box.appendChild(l);
  });
  if (taxa()) { const l = el("div", "line"); l.append(el("span", "", "Taxa de entrega"), el("span", "", money(taxa()))); box.appendChild(l); }
  $("tot").textContent = money(subtotal() + taxa());
}
function tipoUI() {
  const t = $("tipo").value;
  $("endw").style.display = t === "Retirada no local" ? "none" : "block";
  $("endl").textContent = t === "Entrega" ? "Endereço de entrega" : "Número da mesa";
  lines();
}

CONFIG.tipos.forEach(t => $("tipo").add(new Option(t, t)));
CONFIG.pagamentos.forEach(t => $("pag").add(new Option(t, t)));
$("tipo").onchange = tipoUI;
$("open").onclick = () => { $("sheet").classList.add("on"); tipoUI(); };
$("close").onclick = () => $("sheet").classList.remove("on");
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("sheet").classList.remove("on"); });

$("send").onclick = () => {
  const nome = $("cli").value.trim(), tipo = $("tipo").value, end = $("end").value.trim();
  if (!nome) return fail("Informe seu nome.");
  if (tipo !== "Retirada no local" && !end) return fail(tipo === "Entrega" ? "Informe o endereço de entrega." : "Informe o número da mesa.");
  fail("");
  let m = "*Novo pedido – " + CONFIG.nome + "*\n\n";
  Object.entries(cart).forEach(([i, q]) => { const it = MENU[i]; if (it) m += q + "× " + it.n + " – " + money(it.p * q) + "\n"; });
  if (taxa()) m += "Taxa de entrega – " + money(taxa()) + "\n";
  m += "\n*Total: " + money(subtotal() + taxa()) + "*\n\n";
  m += "Nome: " + nome + "\nRecebimento: " + tipo + "\n";
  if (tipo === "Entrega") m += "Endereço: " + end + "\n";
  if (tipo === "Comer na mesa") m += "Mesa: " + end + "\n";
  m += "Pagamento: " + $("pag").value + "\n";
  const obs = $("obs").value.trim(); if (obs) m += "Obs.: " + obs + "\n";
  location.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(m);
};
function fail(t) { $("err").textContent = t; }

/* destaque da categoria visível */
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.c === e.target.id.slice(4)));
  }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("section").forEach(s => io.observe(s));
}
const net = () => $("off").classList.toggle("on", !navigator.onLine);
addEventListener("online", net); addEventListener("offline", net); net();
paint();
</script>
</body>
</html>
